- type: entity
  parent: [ BaseXenoborgChassis, BaseXenoborgTransponder ]
  id: Xenoquad
  name: Quad Xenoborg
  suffix: with brain
  description: A man-machine hybrid that aims to replicate itself. They love extracting brains to insert into fresh Xenoborg chassis to grow their army. This one seems to have 4 legs and additional assets.
  components:
  - type: Construction
    node: start
  - type: BorgTransponder
    name: Quad xenoborg
    sprite:
      sprite: _HL/Mobs/Player/borgs/quads.rsi
      state: XenoQuad
  - type: BorgChassis
    maxModules: 10
    hasMindState: XenoQuad_e
    noMindState: XenoQuad_e_r
    moduleWhitelist:
      tags:
      - BorgModuleGeneric
      - XenoborgModuleGeneric
      - BorgModuleSecurity
      - BorgModuleSyndicate
      - BorgModuleSyndicateAssault
      - BorgModuleMedical
      - BorgModuleEngineering
      - BorgModuleScience
  - type: ContainerFill
    containers:
      borg_brain:
      - MMIFilled
      borg_module:
      - XenoborgModuleBasic
      - BorgModuleKill
      - BorgModuleConstruction
      - BorgModuleRCD
      - BorgModuleTool
      # - BorgModuleAdvancedSurgery # Wayfarer: No Shitmed :(
      - BorgModuleOperative
      - XenoborgModuleFireExtinguisher
  - type: ShowHealthBars
    damageContainers:
    - Inorganic
    - Silicon
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHigh
  - type: Sprite
    sprite: _HL/Mobs/Player/borgs/quads.rsi
    scale: 0.7, 0.7
    layers:
    - state: XenoQuad
      map: ["movement"]
    - state: XenoQuad_e
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: XenoQuad_e
      shader: unshaded
      map: ["light"]
      visible: false
  # Wayfarer: We don't want ballz
  # - type: SpriteStateToggle
  #   spriteLayer: movement
  #   stateOff: XenoQuad
  #   stateOn: XenoQuadballz
  #   movementStateOff: XenoQuad_moving
  #   movementStateOn: XenoQuad_movingballz
  # End Wayfarer
  - type: SpriteMovement
    movementLayers:
      movement:
        state: XenoQuad_moving
    noMovementLayers:
      movement:
        state: XenoQuad
