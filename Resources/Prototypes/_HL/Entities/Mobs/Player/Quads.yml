- type: entity
  id: PlayerBorgQuadserv
  parent: BorgChassisQuadserv
  suffix: Battery, Tools
  components:
  - type: ContainerFill
    containers:
      borg_brain:
        - PositronicBrain
      borg_module:
        - BorgModuleTool
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: RandomMetadata
    nameSegments: [NFNamesBorg]

- type: entity
  id: PlayerBorgQuadmed
  parent: BorgChassisQuadmed
  suffix: Diagnosis, Treatment
