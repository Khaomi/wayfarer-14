  components:
  - type: Sprite
    sprite: _HL/Objects/Specific/Robotics/borgmodule.rsi
    layers:
    - state: security
    - state: icon-Advmeasures
  - type: ItemBorgModule
    moduleId: AdvancedMeasures
    # Wayfarer: use hands
    hands:
     - item: WeaponBorgEnergyShotgun
     - item: BorgWeaponXrayCannon
    # End Wayfarer
